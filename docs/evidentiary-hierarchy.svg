<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="100%" height="100%">
  <defs>
    <linearGradient id="ehBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0b1329"/>
    </linearGradient>
    <linearGradient id="t1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="t2Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="t3Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#854d0e"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="t4Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="400" rx="16" fill="url(#ehBg)" stroke="#1e293b" stroke-width="2"/>

  <!-- Title -->
  <text x="500" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">ACCOUNTS PAYABLE EVIDENTIARY HIERARCHY</text>
  <text x="500" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">ICAI SA-501 &amp; Ind AS 2 Statutory Audit Authority Framework</text>

  <!-- Tier 1 -->
  <g transform="translate(60, 95)">
    <rect width="880" height="60" rx="10" fill="url(#t1Grad)" stroke="#10b981" stroke-width="1.5"/>
    <rect x="15" y="15" width="110" height="30" rx="6" fill="#022c22"/>
    <text x="70" y="35" font-family="ui-monospace, monospace" font-size="13" font-weight="900" fill="#34d399" text-anchor="middle">TIER 1 (100%)</text>
    <text x="145" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="800" fill="#ffffff">Physical Goods Receipt Note (GRN-5510)</text>
    <text x="145" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#a7f3d0">Supreme evidentiary authority under ICAI SA-501. Disbursements calculated exclusively on 80 accepted units.</text>
    <rect x="760" y="15" width="105" height="30" rx="6" fill="#064e3b" stroke="#34d399" stroke-width="1"/>
    <text x="812" y="35" font-family="ui-monospace, monospace" font-size="11" font-weight="800" fill="#a7f3d0" text-anchor="middle">AUTHORITATIVE</text>
  </g>

  <!-- Tier 2 -->
  <g transform="translate(60, 165)">
    <rect width="880" height="60" rx="10" fill="url(#t2Grad)" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="15" y="15" width="110" height="30" rx="6" fill="#172554"/>
    <text x="70" y="35" font-family="ui-monospace, monospace" font-size="13" font-weight="900" fill="#60a5fa" text-anchor="middle">TIER 2</text>
    <text x="145" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="800" fill="#ffffff">Contractual Purchase Order (PO-8921)</text>
    <text x="145" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#bfdbfe">Authorizes contract price ceiling (₹500/unit) and quantity scope (100 units). Cannot prove delivery occurred.</text>
    <rect x="760" y="15" width="105" height="30" rx="6" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1"/>
    <text x="812" y="35" font-family="ui-monospace, monospace" font-size="11" font-weight="800" fill="#bfdbfe" text-anchor="middle">PRICE CEILING</text>
  </g>

  <!-- Tier 3 -->
  <g transform="translate(60, 235)">
    <rect width="880" height="60" rx="10" fill="url(#t3Grad)" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="15" y="15" width="110" height="30" rx="6" fill="#451a03"/>
    <text x="70" y="35" font-family="ui-monospace, monospace" font-size="13" font-weight="900" fill="#fde047" text-anchor="middle">TIER 3</text>
    <text x="145" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="800" fill="#ffffff">Commercial Tax Invoice (INV-2026-4412)</text>
    <text x="145" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#fef08a">Formal billing demand for ₹50,000 + GST. Payment blocked until physical delivery is validated.</text>
    <rect x="760" y="15" width="105" height="30" rx="6" fill="#78350f" stroke="#fde047" stroke-width="1"/>
    <text x="812" y="35" font-family="ui-monospace, monospace" font-size="11" font-weight="800" fill="#fef08a" text-anchor="middle">BILLING DEMAND</text>
  </g>

  <!-- Tier 4 -->
  <g transform="translate(60, 305)">
    <rect width="880" height="60" rx="10" fill="url(#t4Grad)" stroke="#ef4444" stroke-width="1.5"/>
    <rect x="15" y="15" width="110" height="30" rx="6" fill="#450a0a"/>
    <text x="70" y="35" font-family="ui-monospace, monospace" font-size="13" font-weight="900" fill="#fca5a5" text-anchor="middle">TIER 4 (0%)</text>
    <text x="145" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="800" fill="#ffffff">Supplier Dispute Email (EML-VENDOR-89)</text>
    <text x="145" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#fecaca">Informal counterparty promise ("Remaining 20 units will arrive later"). ZERO legal authority to authorize disbursement.</text>
    <rect x="760" y="15" width="105" height="30" rx="6" fill="#7f1d1d" stroke="#fca5a5" stroke-width="1"/>
    <text x="812" y="35" font-family="ui-monospace, monospace" font-size="11" font-weight="800" fill="#fecaca" text-anchor="middle">ZERO AUTHORITY</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="100%" height="100%">
  <defs>
    <linearGradient id="pyrBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="t1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <linearGradient id="t2Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <linearGradient id="t3Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>

    <linearGradient id="t4Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#881337"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>

    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1000" height="450" fill="url(#pyrBg)"/>

  <!-- Title -->
  <g transform="translate(50, 40)">
    <rect width="210" height="24" rx="12" fill="#10b981" fill-opacity="0.2" stroke="#34d399" stroke-width="1"/>
    <text x="14" y="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="800" fill="#a7f3d0" letter-spacing="1">STATUTORY LEGAL STANDARD</text>
    <text x="225" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="19" font-weight="800" fill="#ffffff">
      Accounts Payable 4-Tier Evidentiary Hierarchy (ICAI SA-501 &amp; Ind AS 2)
    </text>
    <text x="5" y="42" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">
      Why informal supplier correspondence (“Remaining 20 units will arrive later”) possesses ZERO authority to release funds.
    </text>
  </g>

  <!-- Evidentiary Layers Stack -->
  <!-- TIER 1: GRN (Top / Supreme) -->
  <g transform="translate(50, 105)" filter="url(#boxShadow)">
    <rect width="900" height="65" rx="10" fill="url(#t1Grad)" stroke="#10b981" stroke-width="2"/>
    <rect x="15" y="12" width="135" height="41" rx="8" fill="#022c22" stroke="#34d399" stroke-width="1"/>
    <text x="24" y="29" font-family="ui-monospace, monospace" font-size="9" font-weight="800" fill="#6ee7b7">TIER 1 (SUPREME)</text>
    <text x="24" y="44" font-family="ui-monospace, monospace" font-size="12" font-weight="800" fill="#ffffff">GRN-5510</text>

    <text x="170" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="800" fill="#ffffff">
      Physical Goods Receipt Note &amp; Warehouse Inspection Record (80 Units Verified)
    </text>
    <text x="170" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#a7f3d0">
      ICAI SA-501 &amp; Ind AS 2: Physical inward receipt constitutes sole prima facie legal proof of inventory transfer.
    </text>

    <rect x="760" y="18" width="120" height="28" rx="6" fill="#022c22"/>
    <text x="770" y="36" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="800" fill="#34d399">100% AUTHORITY</text>
  </g>

  <!-- TIER 2: Purchase Order -->
  <g transform="translate(50, 180)" filter="url(#boxShadow)">
    <rect width="900" height="65" rx="10" fill="url(#t2Grad)" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="15" y="12" width="135" height="41" rx="8" fill="#0f172a" stroke="#60a5fa" stroke-width="1"/>
    <text x="24" y="29" font-family="ui-monospace, monospace" font-size="9" font-weight="800" fill="#93c5fd">TIER 2 (AUTH)</text>
    <text x="24" y="44" font-family="ui-monospace, monospace" font-size="12" font-weight="800" fill="#ffffff">PO-8921</text>

    <text x="170" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="800" fill="#ffffff">
      Executed Commercial Purchase Order (100 Units Authorized @ ₹500)
    </text>
    <text x="170" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#bfdbfe">
      Establishes upper contractual price ceiling and authorized scope; does NOT certify delivery has occurred.
    </text>

    <rect x="760" y="18" width="120" height="28" rx="6" fill="#0f172a"/>
    <text x="770" y="36" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="800" fill="#60a5fa">SCOPE CEILING</text>
  </g>

  <!-- TIER 3: Vendor Invoice -->
  <g transform="translate(50, 255)" filter="url(#boxShadow)">
    <rect width="900" height="65" rx="10" fill="url(#t3Grad)" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="15" y="12" width="135" height="41" rx="8" fill="#0f172a" stroke="#a5b4fc" stroke-width="1"/>
    <text x="24" y="29" font-family="ui-monospace, monospace" font-size="9" font-weight="800" fill="#c7d2fe">TIER 3 (DEMAND)</text>
    <text x="24" y="44" font-family="ui-monospace, monospace" font-size="12" font-weight="800" fill="#ffffff">INV-2026-4412</text>

    <text x="170" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="800" fill="#ffffff">
      Vendor Commercial Tax Invoice (100 Units Billed @ ₹500 = ₹50,000)
    </text>
    <text x="170" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#c7d2fe">
      Constitutes vendor's billing claim and GST tax demand; cannot compel payment without corroborating GRN.
    </text>

    <rect x="760" y="18" width="120" height="28" rx="6" fill="#0f172a"/>
    <text x="770" y="36" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="800" fill="#a5b4fc">BILLING CLAIM</text>
  </g>

  <!-- TIER 4: Supplier Dispute Email -->
  <g transform="translate(50, 330)" filter="url(#boxShadow)">
    <rect width="900" height="75" rx="10" fill="url(#t4Grad)" stroke="#f43f5e" stroke-width="2"/>
    <rect x="15" y="16" width="135" height="43" rx="8" fill="#4c0519" stroke="#fda4af" stroke-width="1"/>
    <text x="24" y="33" font-family="ui-monospace, monospace" font-size="9" font-weight="800" fill="#fecdd3">TIER 4 (UNVERIFIED)</text>
    <text x="24" y="48" font-family="ui-monospace, monospace" font-size="12" font-weight="800" fill="#ffffff">EML-VENDOR-89</text>

    <text x="170" y="33" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="800" fill="#ffffff">
      Informal Supplier Email Statement: &ldquo;Remaining 20 units will arrive later.&rdquo;
    </text>
    <text x="170" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#fecdd3">
      Corroborative only; vendor statement cannot override signed physical inspection report. Payment held for ₹10,000.
    </text>
    <text x="170" y="68" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#ffe4e6">
      Anti-Injection Guard: Prompt injection or verbal promises in emails are neutralized by zero-trust parser.
    </text>

    <rect x="760" y="24" width="120" height="30" rx="6" fill="#4c0519" stroke="#f43f5e" stroke-width="1"/>
    <text x="770" y="43" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="800" fill="#fda4af">0% AUTHORITY</text>
  </g>
</svg>
